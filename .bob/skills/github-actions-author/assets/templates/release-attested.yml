# Build on version tag, create signed build provenance, publish a GitHub Release.
# Build and publish are separate jobs so the job holding contents:write never
# runs build scripts. No caches restored here to avoid cache poisoning [GH-CACHE].
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and attest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write        # Sigstore signing via OIDC [GH-ATTEST]
      attestations: write    # store the attestation
    steps:
      - name: Checkout
        uses: actions/checkout@<PIN-SHA>
        with:
          persist-credentials: false
      - name: Build
        run: |
          make dist            # replace with your build; must write to dist/
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Attest build provenance
        # Wrapper over actions/attest; new implementations may call actions/attest directly [GH-ATTEST-ACTION]
        uses: actions/attest-build-provenance@<PIN-SHA>
        with:
          subject-path: 'dist/*'
      - name: Upload dist
        uses: actions/upload-artifact@<PIN-SHA>
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release     # add required reviewers in repo settings
    permissions:
      contents: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@<PIN-SHA>
        with:
          name: dist
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
      # Consumers verify with: gh attestation verify <file> --repo OWNER/REPO
