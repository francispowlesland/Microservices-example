# CI for pull requests and main. Example uses Node.js; swap the setup step for
# setup-python / setup-go / setup-java and keep everything else.
# Pins: run scripts/pin_actions.py to replace <PIN-SHA> with full commit SHAs.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:            # remove if the repo does not use a merge queue
  workflow_dispatch:

permissions: {}           # nothing by default; jobs opt in [GH-SECURE-USE]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@<PIN-SHA>
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@<PIN-SHA>
        with:
          node-version-file: .nvmrc      # or node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        node: ['20', '22', '24']        # application runtime, independent of the node24 action runtime
    steps:
      - name: Checkout
        uses: actions/checkout@<PIN-SHA>
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@<PIN-SHA>
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@<PIN-SHA>
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@<PIN-SHA>
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload build output
        uses: actions/upload-artifact@<PIN-SHA>
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error
